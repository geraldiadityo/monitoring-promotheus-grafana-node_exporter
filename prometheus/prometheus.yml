global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Memonitor Prometheus itu sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Memonitor Host Server Ubuntu
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Memonitor Container Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']